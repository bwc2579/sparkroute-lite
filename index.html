<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkRoute Lite - 초기 창업가 워크스페이스</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- 모바일 헤더 -->
  <header class="mobile-header">
    <button id="mobileMenuBtn" class="icon-btn" aria-label="메뉴 열기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="mobile-brand">
      <span class="logo-dot"></span>
      <span class="brand-name">SparkRoute</span>
      <span class="brand-badge">Lite</span>
    </div>
    <div class="mobile-header-right">
      <span id="mobileCloudSync" class="cloud-sync-pill" title="Supabase 클라우드 동기화 상태">☁️ 로컬</span>
      <div id="mobileActiveViewTitle" class="mobile-tab-title">메모</div>
    </div>
  </header>

  <div class="app-layout">
    <!-- 사이드바 딤 (모바일) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- 좌측 사이드바 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="logo-icon">⚡</div>
          <div class="brand-info">
            <span class="brand-title">SparkRoute</span>
            <span class="brand-sub">Lite MVP</span>
          </div>
        </div>
        <span id="desktopCloudSync" class="cloud-sync-pill" title="Supabase 클라우드 동기화 상태">☁️ 연결 중</span>
      </div>

      <!-- 모드 전환 탭 (데스크톱/사이드바) -->
      <div class="mode-tabs">
        <button id="tabMemoBtn" class="tab-btn active" data-tab="memo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>트리 메모</span>
        </button>
        <button id="tabTaskBtn" class="tab-btn" data-tab="task">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          <span>칸반 할 일</span>
        </button>
      </div>

      <!-- 트리 네비게이션 영역 -->
      <div class="sidebar-tree-container">
        <div class="tree-header">
          <span class="section-label">비즈니스 브레인</span>
          <span class="tree-guide">3단계 구조</span>
        </div>
        <div id="treeContainer" class="tree-list" role="tree">
          <!-- 동적 트리 렌더링 -->
        </div>
      </div>

      <!-- 대분류 추가 버튼 -->
      <div class="sidebar-footer">
        <button id="btnAddCategory" class="btn btn-secondary btn-full">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>+ 대분류 추가</span>
        </button>
      </div>
    </aside>

    <!-- 메인 작업 영역 -->
    <main class="main-content">
      <!-- 1. 메모 에디터 뷰 -->
      <section id="memoView" class="view-panel active">
        <!-- 문서가 선택되었을 때 -->
        <div id="memoEditorContainer" class="editor-container">
          <div class="editor-header">
            <div class="breadcrumb" id="editorBreadcrumb">
              <span class="crumb">대분류</span>
              <span class="crumb-separator">/</span>
              <span class="crumb">중분류</span>
              <span class="crumb-separator">/</span>
              <span class="crumb active">문서</span>
            </div>
            <div class="editor-meta">
              <span id="saveStatus" class="save-badge saved">저장됨</span>
              <span id="editorUpdatedAt" class="updated-time">-</span>
            </div>
          </div>

          <div class="editor-title-wrap">
            <input 
              type="text" 
              id="docTitleInput" 
              class="doc-title-input" 
              placeholder="문서 제목을 입력하세요..." 
              autocomplete="off"
            >
          </div>

          <div class="editor-toolbar">
            <div class="toolbar-tools">
              <button type="button" class="tool-btn" id="btnInsertChecklist" title="체크박스 삽입">
                ☑️ 할 일 체크박스
              </button>
              <button type="button" class="tool-btn" id="btnInsertHeading" title="헤딩 삽입">
                # 제목
              </button>
              <button type="button" class="tool-btn" id="btnInsertBullet" title="글머리 기호">
                • 글머리
              </button>
            </div>
            <span class="toolbar-hint">300ms 디바운스 실시간 자동 저장</span>
          </div>

          <div class="editor-body-wrap">
            <textarea 
              id="docContentTextarea" 
              class="doc-content-textarea" 
              placeholder="아이디어, 사업 기획, 회의록을 자유롭게 기록하세요..."
            ></textarea>
          </div>
        </div>

        <!-- 문서 미선택 시 Empty State -->
        <div id="memoEmptyState" class="empty-state hidden">
          <div class="empty-illustration">📁</div>
          <h3>작성할 문서를 선택해 주세요</h3>
          <p>좌측 사이드바에서 <strong>소분류(문서)</strong>를 클릭하거나<br>새로운 대분류 및 하위 문서를 생성하여 기획을 시작하세요.</p>
          <button id="btnEmptyAddDoc" class="btn btn-primary">+ 새 카테고리 만들기</button>
        </div>
      </section>

      <!-- 2. 칸반 할 일 보드 뷰 -->
      <section id="taskView" class="view-panel">
        <div class="kanban-wrapper">
          <!-- 상단 빠른 태스크 등록 바 -->
          <div class="task-quick-add">
            <form id="quickAddForm" class="quick-add-form">
              <div class="input-group title-input-group">
                <input 
                  type="text" 
                  id="taskTitleInput" 
                  class="form-control" 
                  placeholder="새로운 실행 태스크를 입력하세요 (예: 법인 통장 개설)" 
                  required
                >
              </div>
              <div class="input-group select-group">
                <label for="taskPrioritySelect" class="sr-only">우선순위</label>
                <select id="taskPrioritySelect" class="form-control select-control">
                  <option value="high">우선순위: 높음 🔥</option>
                  <option value="medium" selected>우선순위: 중간 ⚡</option>
                  <option value="low">우선순위: 낮음 ☕</option>
                </select>
              </div>
              <div class="input-group date-group">
                <label for="taskDueDateInput" class="sr-only">마감일</label>
                <input type="date" id="taskDueDateInput" class="form-control date-control">
              </div>
              <button type="submit" class="btn btn-primary btn-add-task">
                <span>+ 태스크 추가</span>
              </button>
            </form>
          </div>

          <!-- 칸반 3단 컬럼 보드 -->
          <div class="kanban-board">
            <!-- 1. 시작 전 (To-Do) -->
            <div class="kanban-column" data-status="todo" id="columnTodo">
              <div class="column-header status-todo">
                <div class="column-title-wrap">
                  <span class="status-indicator dot-todo"></span>
                  <span class="column-title">시작 전</span>
                  <span class="status-badge" id="countTodo">0</span>
                </div>
              </div>
              <div class="column-dropzone" id="dropzoneTodo" data-status="todo">
                <!-- 카드 동적 렌더링 -->
              </div>
            </div>

            <!-- 2. 진행 중 (In Progress) -->
            <div class="kanban-column" data-status="in_progress" id="columnInProgress">
              <div class="column-header status-in-progress">
                <div class="column-title-wrap">
                  <span class="status-indicator dot-in-progress"></span>
                  <span class="column-title">진행 중</span>
                  <span class="status-badge" id="countInProgress">0</span>
                </div>
              </div>
              <div class="column-dropzone" id="dropzoneInProgress" data-status="in_progress">
                <!-- 카드 동적 렌더링 -->
              </div>
            </div>

            <!-- 3. 완료 (Done) -->
            <div class="kanban-column" data-status="done" id="columnDone">
              <div class="column-header status-done">
                <div class="column-title-wrap">
                  <span class="status-indicator dot-done"></span>
                  <span class="column-title">완료</span>
                  <span class="status-badge" id="countDone">0</span>
                </div>
              </div>
              <div class="column-dropzone" id="dropzoneDone" data-status="done">
                <!-- 카드 동적 렌더링 -->
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 모바일 하단 네비게이션 바 -->
  <nav class="mobile-bottom-nav">
    <button class="bottom-nav-item active" data-tab="memo" id="mobileTabMemo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
      </svg>
      <span>메모</span>
    </button>
    <button class="bottom-nav-item" data-tab="task" id="mobileTabTask">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
      <span>할 일</span>
    </button>
  </nav>

  <!-- 태스크 상세 및 하위 세부 할 일 (Sub-task) 모달 -->
  <div id="taskModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title-group">
          <span id="modalStatusBadge" class="badge status-pill">진행 중</span>
          <span id="modalPriorityBadge" class="badge priority-pill">높음 🔥</span>
        </div>
        <button id="modalCloseBtn" class="icon-btn close-btn" aria-label="닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- 태스크 제목 수정 -->
        <div class="form-row">
          <label for="modalTaskTitle" class="modal-label">태스크 제목</label>
          <input type="text" id="modalTaskTitle" class="form-control modal-title-input">
        </div>

        <!-- 상태, 우선순위, 마감일 수정 -->
        <div class="modal-meta-grid">
          <div class="meta-field">
            <label for="modalTaskStatus" class="modal-label">상태</label>
            <select id="modalTaskStatus" class="form-control">
              <option value="todo">시작 전</option>
              <option value="in_progress">진행 중</option>
              <option value="done">완료</option>
            </select>
          </div>
          <div class="meta-field">
            <label for="modalTaskPriority" class="modal-label">우선순위</label>
            <select id="modalTaskPriority" class="form-control">
              <option value="high">높음 🔥</option>
              <option value="medium">중간 ⚡</option>
              <option value="low">낮음 ☕</option>
            </select>
          </div>
          <div class="meta-field">
            <label for="modalTaskDueDate" class="modal-label">마감일</label>
            <input type="date" id="modalTaskDueDate" class="form-control">
          </div>
        </div>

        <hr class="modal-divider">

        <!-- 세부 할 일 (Sub-task) 섹션 -->
        <div class="subtasks-section">
          <div class="subtasks-header">
            <h4 class="subtasks-title">세부 할 일 (Sub-tasks)</h4>
            <span id="modalProgressText" class="progress-text">0 / 0 (0%)</span>
          </div>

          <!-- 진행률 바 -->
          <div class="progress-bar-container">
            <div id="modalProgressBar" class="progress-bar-fill" style="width: 0%;"></div>
          </div>

          <!-- 세부 할 일 추가 폼 -->
          <form id="modalAddSubtaskForm" class="add-subtask-form">
            <input 
              type="text" 
              id="newSubtaskInput" 
              class="form-control" 
              placeholder="세부 실행 항목을 입력 후 Enter..." 
              autocomplete="off"
            >
            <button type="submit" class="btn btn-secondary btn-sm">+ 추가</button>
          </form>

          <!-- 세부 할 일 목록 -->
          <ul id="modalSubtaskList" class="subtask-items-list">
            <!-- 동적 렌더링 -->
          </ul>
        </div>
      </div>

      <div class="modal-footer">
        <button id="modalDeleteTaskBtn" class="btn btn-danger-ghost">태스크 삭제</button>
        <button id="modalSaveCloseBtn" class="btn btn-primary">확인 및 닫기</button>
      </div>
    </div>
  </div>

  <!-- 간단한 토스트 알림 -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
